<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <script type="text/javascript" src="/homey.js" data-origin="pair"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 20px 16px 120px;
      background: #ffffff;
      color: #1f2937;
      -webkit-text-size-adjust: 100%;
    }
    h1 { font-size: 22px; margin: 0 0 6px; }
    p { font-size: 15px; line-height: 1.4; color: #4b5563; margin: 0 0 18px; }
    .device {
      display: block;
      width: 100%;
      text-align: left;
      padding: 16px;
      margin-bottom: 12px;
      border: 3px solid #d1d5db;
      border-radius: 12px;
      background: #f9fafb;
      font-size: 17px;
      font-weight: 600;
      color: #111827;
      cursor: pointer;
    }
    .device.selected { border-color: #00A3E0; background: #e8f6fd; }
    .device small { display: block; font-size: 14px; font-weight: 400; color: #6b7280; margin-top: 6px; }
    #status { font-size: 15px; color: #374151; min-height: 22px; }
    #status.error { color: #b91c1c; }
    footer {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 12px 16px 24px;
      background: #ffffff;
      border-top: 1px solid #e5e7eb;
    }
    button.primary {
      width: 100%;
      padding: 16px;
      font-size: 18px;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      background: #00A3E0;
      color: #ffffff;
    }
    button.primary:disabled { background: #bfdcea; }
  </style>
</head>
<body>
  <h1>Marstek batterij kiezen</h1>
  <p>Kies hieronder de batterij die je wilt toevoegen. Venus A en Venus E werken met dezelfde app; controleer het IP-adres.</p>

  <div id="list"></div>
  <div id="status">Zoeken op het netwerk&hellip;</div>

  <footer>
    <button id="next" class="primary" disabled>Volgende</button>
  </footer>

  <script type="text/javascript">
    var devices = [];
    var selectedIndex = -1;

    function setStatus(text, isError) {
      var el = document.getElementById('status');
      el.innerHTML = text;
      el.className = isError ? 'error' : '';
    }

    function onHomeyReady(Homey) {
      Homey.ready();

      var listEl = document.getElementById('list');
      var nextEl = document.getElementById('next');

      Homey.emit('list_devices', null, function (error, result) {
        if (error) {
          setStatus('Zoeken mislukt: ' + (error.message || error), true);
          return;
        }

        devices = result || [];
        listEl.innerHTML = '';

        if (!devices.length) {
          setStatus('Geen apparaten gevonden. Controleer of de batterij op hetzelfde netwerk zit.', true);
          return;
        }

        devices.forEach(function (device, index) {
          var settings = device.settings || {};
          var detail = settings.host ? ('IP ' + settings.host + (settings.port ? ' · poort ' + settings.port : '')) : 'handmatig instellen';

          // device.name komt uit een UDP-broadcast op het netwerk: via
          // textContent ipv innerHTML zetten, zodat een geknutseld apparaat
          // geen HTML in dit scherm kan injecteren.
          var button = document.createElement('button');
          button.className = 'device';
          button.textContent = device.name;
          var detailEl = document.createElement('small');
          detailEl.textContent = detail;
          button.appendChild(detailEl);
          button.addEventListener('click', function () {
            selectedIndex = index;
            Array.prototype.forEach.call(document.querySelectorAll('.device'), function (element) {
              element.className = 'device';
            });
            button.className = 'device selected';
            nextEl.disabled = false;
          });
          listEl.appendChild(button);
        });

        setStatus(devices.length + ' apparaat/apparaten gevonden.');
      });

      nextEl.addEventListener('click', function () {
        if (selectedIndex < 0) return;

        var device = devices[selectedIndex];
        nextEl.disabled = true;
        setStatus('Bezig met toevoegen&hellip;');

        Homey.createDevice(device).then(function () {
          setStatus('Toegevoegd.');
          Homey.done();
        }).catch(function (error) {
          setStatus('Toevoegen mislukt: ' + (error.message || error), true);
          nextEl.disabled = false;
        });
      });
    }
  </script>
</body>
</html>
